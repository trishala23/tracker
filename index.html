<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Interview Prep Tracker</title>
<style>
:root {
  --bg: #f6f7f9; --card: #ffffff; --text: #1b1f24; --muted: #5f6b7a; --border: #e2e6eb;
  --accent: #2f6fdd; --accent-soft: #e6eefc; --done: #1f9d55; --warn: #c7771a; --track: #e9edf2;
  --p0: #d64545; --p1: #d9822b; --p2: #c9a227;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1216; --card: #171b21; --text: #e6e9ee; --muted: #93a0b0; --border: #262c35;
    --accent: #6b9bff; --accent-soft: #1b2638; --done: #3fbf78; --warn: #e5a04a; --track: #252b34;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1216; --card: #171b21; --text: #e6e9ee; --muted: #93a0b0; --border: #262c35;
  --accent: #6b9bff; --accent-soft: #1b2638; --done: #3fbf78; --warn: #e5a04a; --track: #252b34;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text);
  font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
.wrap { max-width: 960px; margin: 0 auto; padding: 20px 16px 60px; }
h1 { font-size: 1.5rem; margin: 0 0 4px; }
.sub { color: var(--muted); margin: 0 0 18px; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 16px; }
.stat { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; }
.stat .v { font-size: 1.6rem; font-weight: 700; font-variant-numeric: tabular-nums; }
.stat .l { color: var(--muted); font-size: .85rem; }
.bar { height: 8px; background: var(--track); border-radius: 99px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--accent); border-radius: 99px; transition: width .25s; }
.bar.full > i { background: var(--done); }
.big .bar { height: 12px; }
.toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 16px 0; }
.tabs { display: flex; gap: 4px; background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 4px; }
.tabs button { border: 0; background: none; color: var(--muted); padding: 6px 12px; border-radius: 7px; cursor: pointer; font: inherit; }
.tabs button.on { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.spacer { flex: 1; }
.btn { border: 1px solid var(--border); background: var(--card); color: var(--text); padding: 6px 10px;
  border-radius: 8px; cursor: pointer; font: inherit; font-size: .9rem; }
.btn:hover { border-color: var(--accent); }
label.chk { display: inline-flex; gap: 6px; align-items: center; color: var(--muted); font-size: .9rem; cursor: pointer; }
details.card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; margin-bottom: 12px; }
details.card > summary, .day > summary { list-style: none; cursor: pointer; padding: 14px 16px; }
details summary::-webkit-details-marker { display: none; }
.sumrow { display: flex; gap: 12px; align-items: baseline; justify-content: space-between; margin-bottom: 8px; }
.sumrow h2, .sumrow h3 { margin: 0; font-size: 1.05rem; }
.sumrow h3 { font-size: .98rem; }
.pct { font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
.meta { color: var(--muted); font-size: .85rem; }
.body { padding: 0 16px 14px; }
.day { border: 1px solid var(--border); border-radius: 10px; margin: 10px 0; background: var(--bg); }
.day > summary { padding: 10px 12px; }
.day.today { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
.tag { display: inline-block; font-size: .72rem; font-weight: 600; padding: 1px 7px; border-radius: 99px;
  margin-left: 6px; vertical-align: middle; }
.tag.today { background: var(--accent); color: #fff; }
.tag.late { background: var(--warn); color: #fff; }
.tag.ok { background: var(--done); color: #fff; }
.tag.P0 { background: var(--p0); color: #fff; } .tag.P1 { background: var(--p1); color: #fff; } .tag.P2 { background: var(--p2); color: #1b1f24; }
ul.items { list-style: none; margin: 0; padding: 4px 12px 10px; columns: 2 260px; column-gap: 20px; }
ul.items li { break-inside: avoid; }
ul.items label { display: flex; gap: 8px; align-items: flex-start; padding: 4px 0; cursor: pointer; }
ul.items input { margin-top: 3px; accent-color: var(--done); width: 16px; height: 16px; flex: none; }
ul.items input:checked + span { color: var(--muted); text-decoration: line-through; }
.hide-done li.is-done { display: none; }
.dayactions { padding: 0 12px 10px; display: flex; gap: 8px; }
.dayactions .btn { font-size: .8rem; padding: 3px 8px; }
.note { width: 100%; min-height: 54px; margin: 0 12px 12px; width: calc(100% - 24px); resize: vertical;
  border: 1px solid var(--border); border-radius: 8px; background: var(--card); color: var(--text); padding: 8px; font: inherit; font-size: .9rem; }
table.pri { width: 100%; border-collapse: collapse; font-size: .9rem; }
table.pri td { padding: 5px 4px; border-bottom: 1px solid var(--border); }
table.pri td:last-child { width: 45%; }
.hidden { display: none; }
footer { color: var(--muted); font-size: .8rem; margin-top: 24px; }
@media (max-width: 520px) { ul.items { columns: 1; } .stat .v { font-size: 1.3rem; } }
</style>
</head>
<body>
<div class="wrap">
  <h1 id="title">Interview Prep Tracker</h1>
  <p class="sub" id="subtitle"></p>

  <div class="stats">
    <div class="stat big"><div class="v" id="s-overall">0%</div><div class="l">Daily plan complete</div><div class="bar"><i id="b-overall"></i></div></div>
    <div class="stat big"><div class="v" id="s-topics">0%</div><div class="l">Master checklist</div><div class="bar"><i id="b-topics"></i></div></div>
    <div class="stat"><div class="v" id="s-days">0</div><div class="l">Days fully done</div></div>
    <div class="stat"><div class="v" id="s-left">0</div><div class="l">Days left</div></div>
    <div class="stat"><div class="v" id="s-pace">—</div><div class="l">Pace vs. calendar</div></div>
  </div>

  <div class="toolbar">
    <div class="tabs">
      <button data-tab="daily" class="on">Daily plan</button>
      <button data-tab="topics">Topic checklist</button>
      <button data-tab="priority">Priorities</button>
    </div>
    <button class="btn" id="jump">Jump to today</button>
    <div class="spacer"></div>
    <label class="chk"><input type="checkbox" id="hideDone"> Hide done</label>
    <button class="btn" id="theme" title="Toggle theme">◐</button>
    <button class="btn" id="export">Export</button>
    <button class="btn" id="import">Import</button>
    <input type="file" id="importFile" accept="application/json" class="hidden">
    <button class="btn" id="reset">Reset</button>
  </div>

  <section id="tab-daily"></section>
  <section id="tab-topics" class="hidden"></section>
  <section id="tab-priority" class="hidden"></section>

  <footer>Progress is saved in this browser (localStorage). Use <b>Export</b> / <b>Import</b> to move it between devices.</footer>
</div>

<script src="plan.js"></script>
<script>
(function () {
  const PLAN = window.PLAN;
  const KEY = "prep-tracker-v1";
  let state = load();

  function load() {
    try { return Object.assign({ done: {}, notes: {} }, JSON.parse(localStorage.getItem(KEY) || "{}")); }
    catch (e) { return { done: {}, notes: {} }; }
  }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }

  const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const itemKey = (sec, text) => sec + "::" + text;
  const pct = (d, t) => t ? Math.round(d / t * 100) : 0;
  const todayStr = (() => { const d = new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); })();
  const fmt = iso => new Date(iso + "T00:00:00").toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric" });
  const bar = p => `<div class="bar${p === 100 ? " full" : ""}"><i style="width:${p}%"></i></div>`;

  function count(sec, items) {
    let d = 0; items.forEach(t => { if (state.done[itemKey(sec, t)]) d++; });
    return [d, items.length];
  }
  function itemList(sec, items) {
    return `<ul class="items">` + items.map(t => {
      const k = itemKey(sec, t), on = !!state.done[k];
      return `<li class="${on ? "is-done" : ""}"><label><input type="checkbox" data-k="${esc(k)}"${on ? " checked" : ""}><span>${esc(t)}</span></label></li>`;
    }).join("") + `</ul>`;
  }

  // Remember which <details> are open across re-renders.
  const openSet = new Set();
  function isOpen(id, dflt) { return openSet.has(id) || (dflt && !openSet.has("!" + id)); }

  function renderDaily() {
    const el = document.getElementById("tab-daily");
    el.innerHTML = PLAN.phases.map(ph => {
      let pd = 0, pt = 0;
      const days = ph.days.map(day => {
        const sec = "day:" + day.date;
        const [d, t] = count(sec, day.items); pd += d; pt += t;
        const p = pct(d, t);
        let tag = "";
        if (p === 100) tag = `<span class="tag ok">done</span>`;
        else if (day.date === todayStr) tag = `<span class="tag today">today</span>`;
        else if (day.date < todayStr) tag = `<span class="tag late">behind</span>`;
        const open = isOpen(sec, day.date === todayStr);
        return `<details class="day${day.date === todayStr ? " today" : ""}" data-id="${sec}" id="d-${day.date}"${open ? " open" : ""}>
          <summary><div class="sumrow"><h3>${esc(fmt(day.date))} — ${esc(day.title)}${tag}</h3><span class="pct">${d}/${t} · ${p}%</span></div>${bar(p)}</summary>
          ${itemList(sec, day.items)}
          <div class="dayactions"><button class="btn" data-all="${sec}">Check all</button><button class="btn" data-none="${sec}">Clear</button></div>
          <textarea class="note" data-note="${sec}" placeholder="Notes, weak spots, links…">${esc(state.notes[sec] || "")}</textarea>
        </details>`;
      }).join("");
      const p = pct(pd, pt);
      const hasToday = ph.days.some(d => d.date === todayStr);
      const open = isOpen(ph.id, hasToday);
      return `<details class="card" data-id="${ph.id}"${open ? " open" : ""}>
        <summary><div class="sumrow"><h2>${esc(ph.title)}</h2><span class="pct">${p}%</span></div>
        <div class="meta" style="margin-bottom:8px">${esc(ph.range)}${ph.goal ? " · " + esc(ph.goal) : ""} · ${pd}/${pt} items</div>${bar(p)}</summary>
        <div class="body">${days}</div></details>`;
    }).join("");
  }

  function renderTopics() {
    const el = document.getElementById("tab-topics");
    el.innerHTML = PLAN.topics.map(tp => {
      const sec = "topic:" + tp.id;
      const [d, t] = count(sec, tp.items), p = pct(d, t);
      return `<details class="card" data-id="${sec}"${isOpen(sec, false) ? " open" : ""}>
        <summary><div class="sumrow"><h2>${esc(tp.title)}<span class="tag ${tp.p}">${tp.p}</span></h2><span class="pct">${d}/${t} · ${p}%</span></div>${bar(p)}</summary>
        ${itemList(sec, tp.items)}
        <div class="dayactions"><button class="btn" data-all="${sec}">Check all</button><button class="btn" data-none="${sec}">Clear</button></div>
      </details>`;
    }).join("");
  }

  function renderPriority() {
    const el = document.getElementById("tab-priority");
    const topicPct = {};
    PLAN.topics.forEach(tp => { const [d, t] = count("topic:" + tp.id, tp.items); topicPct[tp.title] = pct(d, t); });
    el.innerHTML = `<div class="card" style="background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px 16px">
      <table class="pri">${PLAN.priorities.map(r => `<tr><td><span class="tag ${r.p}" style="margin:0 8px 0 0">${r.p}</span>${esc(r.area)}</td><td class="meta">${esc(r.depth)}</td></tr>`).join("")}</table>
      <p class="meta" style="margin-top:12px">Per-area progress is on the <b>Topic checklist</b> tab.</p></div>`;
  }

  function daysBetween(a, b) { return Math.round((new Date(b + "T00:00:00") - new Date(a + "T00:00:00")) / 864e5); }

  function renderStats() {
    let d = 0, t = 0, fullDays = 0, expected = 0, total = 0;
    PLAN.phases.forEach(ph => ph.days.forEach(day => {
      const [dd, tt] = count("day:" + day.date, day.items);
      d += dd; t += tt; total++;
      if (dd === tt) fullDays++;
      if (day.date < todayStr) expected += tt;
    }));
    let td = 0, tt = 0;
    PLAN.topics.forEach(tp => { const [a, b] = count("topic:" + tp.id, tp.items); td += a; tt += b; });
    const po = pct(d, t), pt = pct(td, tt);
    document.getElementById("s-overall").textContent = po + "%";
    document.getElementById("b-overall").style.width = po + "%";
    document.getElementById("s-topics").textContent = pt + "%";
    document.getElementById("b-topics").style.width = pt + "%";
    document.getElementById("s-days").textContent = fullDays + " / " + total;
    const left = Math.max(0, daysBetween(todayStr, PLAN.end) + 1);
    document.getElementById("s-left").textContent = todayStr > PLAN.end ? 0 : Math.min(left, total);
    const diff = d - expected;
    document.getElementById("s-pace").textContent = todayStr < PLAN.start ? "not started"
      : diff >= 0 ? "on track" + (diff > 0 ? " +" + diff : "") : diff + " items";
    document.getElementById("s-pace").style.color = diff >= 0 ? "var(--done)" : "var(--warn)";
  }

  function renderAll() {
    renderDaily(); renderTopics(); renderPriority(); renderStats();
  }

  document.getElementById("title").textContent = PLAN.title;
  document.getElementById("subtitle").textContent = `${fmt(PLAN.start)} → ${fmt(PLAN.end)} · today is ${fmt(todayStr)}`;

  // Events
  document.addEventListener("change", e => {
    const k = e.target.dataset && e.target.dataset.k;
    if (k) {
      if (e.target.checked) state.done[k] = Date.now(); else delete state.done[k];
      save(); renderAll();
    }
  });
  document.addEventListener("input", e => {
    const n = e.target.dataset && e.target.dataset.note;
    if (n !== undefined) { if (e.target.value) state.notes[n] = e.target.value; else delete state.notes[n]; save(); }
  });
  document.addEventListener("toggle", e => {
    const id = e.target.dataset && e.target.dataset.id;
    if (!id) return;
    if (e.target.open) { openSet.add(id); openSet.delete("!" + id); } else { openSet.delete(id); openSet.add("!" + id); }
  }, true);
  document.addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    const setAll = (sec, on) => {
      const all = PLAN.phases.flatMap(p => p.days.map(d => ["day:" + d.date, d.items])).concat(PLAN.topics.map(t => ["topic:" + t.id, t.items]));
      const found = all.find(x => x[0] === sec); if (!found) return;
      found[1].forEach(t => { const k = itemKey(sec, t); if (on) state.done[k] = state.done[k] || Date.now(); else delete state.done[k]; });
      save(); renderAll();
    };
    if (b.dataset.all) setAll(b.dataset.all, true);
    else if (b.dataset.none) setAll(b.dataset.none, false);
    else if (b.dataset.tab) {
      document.querySelectorAll(".tabs button").forEach(x => x.classList.toggle("on", x === b));
      ["daily", "topics", "priority"].forEach(t => document.getElementById("tab-" + t).classList.toggle("hidden", t !== b.dataset.tab));
      try { localStorage.setItem(KEY + ":tab", b.dataset.tab); } catch (err) {}
    }
  });
  document.getElementById("jump").onclick = () => {
    document.querySelector('[data-tab="daily"]').click();
    let target = PLAN.phases.flatMap(p => p.days).find(d => d.date >= todayStr) || PLAN.phases.at(-1).days.at(-1);
    const el = document.getElementById("d-" + target.date);
    if (!el) return;
    el.open = true; el.closest("details.card").open = true;
    el.scrollIntoView({ behavior: "smooth", block: "start" });
  };
  document.getElementById("hideDone").onchange = e => {
    document.body.classList.toggle("hide-done", e.target.checked);
    try { localStorage.setItem(KEY + ":hide", e.target.checked ? "1" : ""); } catch (err) {}
  };
  document.getElementById("theme").onclick = () => {
    const cur = document.documentElement.dataset.theme ||
      (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    const next = cur === "dark" ? "light" : "dark";
    document.documentElement.dataset.theme = next;
    try { localStorage.setItem(KEY + ":theme", next); } catch (err) {}
  };
  document.getElementById("export").onclick = () => {
    const blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = "prep-progress-" + todayStr + ".json"; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  };
  document.getElementById("import").onclick = () => document.getElementById("importFile").click();
  document.getElementById("importFile").onchange = e => {
    const f = e.target.files[0]; if (!f) return;
    f.text().then(txt => {
      try { const s = JSON.parse(txt); state = { done: s.done || {}, notes: s.notes || {} }; save(); renderAll(); alert("Progress imported."); }
      catch (err) { alert("That file isn't a valid export."); }
      e.target.value = "";
    });
  };
  document.getElementById("reset").onclick = () => {
    if (confirm("Clear ALL progress and notes? Consider exporting first.")) { state = { done: {}, notes: {} }; save(); renderAll(); }
  };

  // Restore UI prefs
  try {
    const th = localStorage.getItem(KEY + ":theme"); if (th) document.documentElement.dataset.theme = th;
    if (localStorage.getItem(KEY + ":hide")) { document.getElementById("hideDone").checked = true; document.body.classList.add("hide-done"); }
  } catch (err) {}
  renderAll();
  try { const tab = localStorage.getItem(KEY + ":tab"); if (tab) document.querySelector(`[data-tab="${tab}"]`).click(); } catch (err) {}
})();
</script>
</body>
</html>
